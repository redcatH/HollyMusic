services:
  # 主应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 使用 BuildKit 加速构建
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: lx-music-app:latest
    container_name: lx-music-app
    ports:
      - "3099:3000"
    environment:
      - NODE_ENV=production
    volumes:
      # 本地目录映射（方便编辑）
      - ./custom-sources:/app/custom-sources
      - ./config:/app/config
      # 持久化缓存目录
      - cache_data:/app/data/cache
      # 日志目录（可选）
      - app_logs:/app/logs
    networks:
      - redcat-network
    # depends_on:
    #   - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # # Redis 缓存服务（可选）
