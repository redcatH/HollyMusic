services:
  # 主应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 使用 BuildKit 加速构建
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: lx-music-app:latest
    container_name: lx-music-app
    ports:
      - "3099:3000"
    # 从宿主 .env 注入环境变量（AUTH_SECRET / AUDIO_CACHE_* 等）
    # environment 中的同名变量优先级更高，会覆盖 env_file
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./prisma/data/music.db
      # 音频磁盘缓存：指向已挂载的 cache_data volume，多用户共享 + Range 支持
      - ENABLE_FILE_CACHE=true
      - AUDIO_CACHE_DIR=/app/.cache/audio-cache
      - AUDIO_CACHE_QUOTA_GB=10
    volumes:
      # 本地目录映射（方便编辑）
      - ./custom-sources:/app/custom-sources
      - ./config:/app/config
      # 数据库文件持久化（重要！）
      - ./prisma_data:/app/prisma/prisma/data
      # 缓存目录（音频磁盘缓存 + 其他缓存，映射到 AUDIO_CACHE_DIR）
      - ./cache_data:/app/.cache
      # 日志目录（可选）
      - ./app_logs:/app/logs
    # depends_on:
    #   - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

