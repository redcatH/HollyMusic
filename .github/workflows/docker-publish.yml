name: Build and Push Docker Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已有双架构镜像的 tag；只恢复 Release，不重建或覆盖镜像'
        required: true
        type: string

permissions:
  contents: read

# 串行更新版本、通道和 Release，防止较旧运行覆盖新版本。
concurrency:
  group: docker-release
  cancel-in-progress: false
  queue: max

env:
  RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'recover' || 'publish' }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate tag, metadata, main CI and image state
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs preflight "$RELEASE_TAG"

  build-and-push:
    needs: preflight
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v4
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: |
            hollymusic:release-test
            ${{ env.IMAGE_NAME }}:build-${{ github.run_id }}-${{ matrix.arch }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Verify architecture and first-run setup
        env:
          EXPECTED_PLATFORM: linux/${{ matrix.arch }}
        run: |
          test "$(docker image inspect hollymusic:release-test --format '{{.Os}}/{{.Architecture}}')" = "$EXPECTED_PLATFORM"
          node scripts/test-docker-setup.mjs hollymusic:release-test 2>&1 | tee docker-smoke.log
      - name: Push verified platform image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker push "${IMAGE_NAME}:build-${GITHUB_RUN_ID}-${ARCH}"
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ matrix.arch }}
          path: docker-smoke.log
          if-no-files-found: ignore
          retention-days: 7

  publish-manifest:
    needs: [preflight, build-and-push]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      promoted: ${{ steps.publish.outputs.promoted }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable version and advance channel
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
        run: node scripts/release.mjs publish "$RELEASE_TAG"

  release:
    needs: [preflight, publish-manifest]
    if: >-
      always() && needs.preflight.result == 'success' &&
      (needs.publish-manifest.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.publish-manifest.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish reviewed release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
          CHANNEL_PROMOTED: ${{ needs.publish-manifest.outputs.promoted }}
        run: node scripts/release.mjs release "$RELEASE_TAG"
