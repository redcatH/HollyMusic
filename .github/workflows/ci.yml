name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./prisma/data/music.db
      AUTH_SECRET: ci-dummy-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C frontend install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm prisma:generate
      - name: Validate release metadata and tooling
        run: |
          pnpm release:check
          pnpm test:release
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test backend
        run: pnpm test --reporter=default --reporter=junit --outputFile=test-results/backend.xml
      - name: Test frontend
        run: pnpm -C frontend test --reporter=default --reporter=junit --outputFile=../test-results/frontend.xml
      - name: Build
        run: |
          pnpm build
          pnpm -C frontend build
      - name: Verify native equalizer response and automation
        timeout-minutes: 2
        env:
          CHROME_BIN: google-chrome
        run: |
          "$CHROME_BIN" --version
          node scripts/check-equalizer-response.mjs
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: hollymusic:setup-test
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Verify architecture and first-run setup
        env:
          EXPECTED_PLATFORM: linux/${{ matrix.arch }}
        run: |
          test "$(docker image inspect hollymusic:setup-test --format '{{.Os}}/{{.Architecture}}')" = "$EXPECTED_PLATFORM"
          node scripts/test-docker-setup.mjs hollymusic:setup-test 2>&1 | tee docker-smoke.log
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-${{ matrix.arch }}
          path: docker-smoke.log
          if-no-files-found: ignore
          retention-days: 7

  # 保持现有 required check 名称；失败、取消或意外跳过均不能放行。
  check:
    if: always()
    needs: [quality, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: test "$QUALITY_RESULT" = success && test "$DOCKER_RESULT" = success
