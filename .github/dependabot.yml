version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    ignore:
      - update-types: ["version-update:semver-major"]

      # - dependency-name: "lodash"
      # - dependency-name: "webpack"