version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/frontend']
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    rebase-strategy: auto
    # Restrict routine updates only; security fixes may require a major upgrade.
    allow:
      - dependency-name: '*'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      next:
        patterns: ['next', 'eslint-config-next']
      test-tools:
        patterns: ['vite', 'vitest', '@vitejs/plugin-react', 'jsdom']
      shared-runtime:
        patterns: ['axios', 'qs', 'tailwind-merge']
      # Keep this last: the first matching version-update group wins.
      other-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ['*']
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    allow:
      - dependency-name: '*'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
