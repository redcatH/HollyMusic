name: ✨ 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！提交前请先搜索是否已有相同 Issue。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能是为了解决什么痛点？当前有什么不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望怎么实现？交互流程是怎样的？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他方案
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、参考链接、其他上下文
