# 优先用上游（外层 CDN/反代）传来的协议，回退本机 $scheme。
# 否则 HTTPS 站点经 HTTP 回源时 /api/share 会生成 http URL，触发 301 丢 query。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: 所有非文件请求回退到 index.html（react-router 接管路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（Vite 构建产物带 hash，一年强缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # PWA 核心文件不缓存
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # 图标缓存
    location /icons/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location ~* ^/icon.*\.svg$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # API 反代到 Next.js（127.0.0.1:3001）
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 优先透传上游（外层 CDN/反代）已设的协议，回退本机 $scheme（见顶部 map）
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        # /api/audio 是流式 Range 请求，需要透传
        proxy_set_header Connection "";
    }

    # /rest Subsonic 协议反代
    location /rest/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 与 /api 保持一致：TLS 在外层 CDN/反代终止时仍将原始 HTTPS 协议传给 Next.js。
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
